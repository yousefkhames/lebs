<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lebs</title>
  <meta name="description" content="Clothing store">
  <meta name="theme-color" content="#F4EDE1">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" id="favicon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#app" id="skip">Skip to content</a>
  <header class="top" id="top"></header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <footer class="foot" id="foot"></footer>
  <nav class="dock" id="dock" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">This store needs JavaScript.</p></noscript>
  <script>
  // Config selection: lebs.config.js by default. "?demo=noor" loads examples/noor.config.js (rebranding demo).
  (function () {
    var m = /[?&]demo=([a-z0-9-]{1,30})(&|$)/.exec(location.search);
    document.write('<script src="' + (m ? 'examples/' + m[1] + '.config.js' : 'lebs.config.js') + '"><\/script>');
  })();
  </script>
  <script src="js/lib.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
